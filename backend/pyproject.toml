[project]
name = "parallel-life-backend"
version = "0.1.0"
description = "Parallel Life Simulator - AI驱动的平行人生推演引擎"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "openai>=1.0.0",
    "zep-cloud==3.13.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "charset-normalizer>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
